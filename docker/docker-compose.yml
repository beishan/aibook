x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  postgres:
    image: postgres:16-alpine
    container_name: aibook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aibook
      POSTGRES_USER: aibook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    command: ["postgres", "-c", "timezone=${TZ:-Asia/Shanghai}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibook -d aibook"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - aibook-network

  redis:
    image: redis:7-alpine
    container_name: aibook-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    networks:
      - aibook-network

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    container_name: aibook-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?请配置 MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?请配置 MINIO_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_API_PORT:-9200}:9200"
      - "${MINIO_CONSOLE_PORT:-9201}:9201"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - aibook-network

  backend:
    image: ${BACKEND_IMAGE:-aibook-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    group_add:
      - "${BOOKS_GID:-1001}"
    container_name: aibook-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_TIME_ZONE: ${TZ:-Asia/Shanghai}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aibook
      SPRING_DATASOURCE_USERNAME: aibook
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      SCANNING_DIRECTORIES: /scanfolder
      UPLOAD_PATH: /app/uploads
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      LOGGING_LEVEL_COM_AIBOOK: ${APP_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
      - ${BOOKS_PATH:?请配置飞牛 NAS 宿主机书籍目录 BOOKS_PATH}:/scanfolder
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks:
      - aibook-network

  frontend:
    image: ${FRONTEND_IMAGE:-aibook-frontend:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aibook-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging
    networks:
      - aibook-network

volumes:
  postgres_data:
    name: aibook-postgres-data
  redis_data:
    name: aibook-redis-data
  minio_data:
    name: aibook-minio-data
  uploads_data:
    name: aibook-uploads-data
  backups_data:
    name: aibook-backups
  deploy_state:
    name: aibook-deploy-state

networks:
  aibook-network:
    name: aibook-network
    driver: bridge
